name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: caspra
          POSTGRES_PASSWORD: caspra
          POSTGRES_DB: caspra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caspra -d caspra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://caspra:caspra@localhost:5432/caspra_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-secret-key
      DEVICE_HMAC_SECRET: ci-device-v1-secret
      DEVICE_SECRET_ENCRYPTION_KEY: ci-device-encryption-key
      TESTING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest
      - run: alembic upgrade head
      - run: python scripts/gen_openapi.py
      - run: git diff --exit-code -- openapi.json
      - run: pip-audit -r requirements.txt

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
      - run: npm run generate:api
      - run: git diff --exit-code -- src/api/schema.d.ts
      - run: npm run check:icons
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
