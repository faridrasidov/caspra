name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: caspra
          POSTGRES_PASSWORD: caspra
          POSTGRES_DB: caspra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caspra -d caspra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://caspra:caspra@localhost:5432/caspra_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-secret-key
      DEVICE_HMAC_SECRET: ci-device-v1-secret
      DEVICE_SECRET_ENCRYPTION_KEY: ci-device-encryption-key
      TESTING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: mypy
      - run: pytest --cov --cov-report=term
      - run: alembic upgrade head
      - run: python scripts/gen_openapi.py
      - run: git diff --exit-code -- openapi.json
      - run: pip-audit -r requirements.txt

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit
      - run: npm run generate:api
      - run: git diff --exit-code -- src/api/schema.d.ts
      - run: npm run check:icons
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high

  deploy_frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs: [validate, dashboard]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Prepare frontend checks
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SERVER_PATH" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Frontend deploy secrets are incomplete. Set SERVER_HOST, SERVER_USER, SERVER_PATH, SSH_PRIVATE_KEY."
            exit 1
          fi
          npm ci --no-audit
          npm run generate:api
          npm run check:icons
          npm run typecheck
          npm run build
        env:
          SERVER_HOST: ${{ secrets.FRONTEND_SERVER_HOST }}
          SERVER_USER: ${{ secrets.FRONTEND_SERVER_USER }}
          SERVER_PATH: ${{ secrets.FRONTEND_SERVER_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.FRONTEND_SSH_PRIVATE_KEY }}
        working-directory: web

      - name: Sync frontend files to server
        env:
          SERVER_HOST: ${{ secrets.FRONTEND_SERVER_HOST }}
          SERVER_USER: ${{ secrets.FRONTEND_SERVER_USER }}
          SERVER_PATH: ${{ secrets.FRONTEND_SERVER_PATH }}
          SERVER_PORT: ${{ secrets.FRONTEND_SERVER_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.FRONTEND_SSH_PRIVATE_KEY }}
          SERVER_RELOAD_CMD: ${{ secrets.FRONTEND_SERVER_RELOAD_CMD }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          PORT="${SERVER_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          for i in $(seq 1 20); do
            echo "Checking backend readiness over SSH ($i/20)..."
            if ssh -p "$PORT" "$SERVER_USER@$SERVER_HOST" \
              "curl -fsS http://127.0.0.1:8000/api/v1/health/ready >/dev/null"; then
              echo "Backend readiness check passed."
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "::error::Backend readiness check failed on the deployment server."
              exit 1
            fi
            sleep 5
          done
          rsync -az -e "ssh -p $PORT -o StrictHostKeyChecking=yes" ./dist/ "$SERVER_USER@$SERVER_HOST:$SERVER_PATH/"
          if [ -n "$SERVER_RELOAD_CMD" ]; then
            ssh -p "$PORT" "$SERVER_USER@$SERVER_HOST" "$SERVER_RELOAD_CMD"
          fi
        working-directory: web
